name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        working-directory: mobile
        run: npm install

      - name: Add Android
        working-directory: mobile
        run: npx cap add android

      - name: Override MainActivity
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/java/ir/bikalam/shad
          cp android-override/MainActivity.java android/app/src/main/java/ir/bikalam/shad/MainActivity.java

      - name: Generate icons
        working-directory: mobile
        run: npx @capacitor/assets generate --android

      - name: Sync
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: shad-app-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
